name: Deploy Python API to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USERNAME: ${{ secrets.EC2_USERNAME }}
          ENV: ${{ secrets.ENV }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            --exclude=".git" \
            --exclude="__pycache__" \
            --exclude="models" \
            --exclude=".env" \
            ./ "$USERNAME@$HOST:/home/ec2-user/palapal/palapal.ai-python/"

          ssh -o StrictHostKeyChecking=no "$USERNAME@$HOST" <<EOF
            printf '%s\n' "$ENV" > /home/ec2-user/palapal/palapal.ai-python/.env

            cd /home/ec2-user/palapal
            docker compose up -d --build python-api
          EOF
